name: Package and publish addon release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Verify addon files and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          case "$REPO" in
            Questie-X)
              dirs=(Questie-X)
              ;;
            LootCollector)
              dirs=(LootCollector LootCollector_CustomImport LootCollector_StarterDB)
              ;;
            DBM-CoA)
              mapfile -t dirs < <(find . -maxdepth 1 -type d -name 'DBM-*' -printf '%f\n' | sort)
              ;;
            *)
              echo "::error::Unknown addon repository: $REPO"
              exit 1
              ;;
          esac
          test "${#dirs[@]}" -gt 0 || { echo "::error::No addon directories"; exit 1; }
          for dir in "${dirs[@]}"; do
            test -d "$dir" || { echo "::error::Missing $dir"; exit 1; }
            test -n "$(find "$dir" -maxdepth 1 -name '*.toc' -print -quit)" || { echo "::error::Missing .toc in $dir"; exit 1; }
          done
          if [ "$REPO" = DBM-CoA ]; then
            for dir in DBM-Core DBM-GUI DBM-CoA-Learner DBM-CoA-Observer; do
              test -d "$dir" || { echo "::error::Required DBM folder missing: $dir"; exit 1; }
            done
          fi
          zip -qr "dist/${REPO}-${VERSION}.zip" "${dirs[@]}" -x '*/.DS_Store' '*/Thumbs.db'
      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.event.repository.name }}"
          VERSION="${GITHUB_REF_NAME}"
          gh release create "$VERSION" "dist/${REPO}-${VERSION}.zip" --title "${REPO} ${VERSION}" --generate-notes --verify-tag
